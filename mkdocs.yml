site_name: callscope
site_description: See every HTTP, SQL and Redis call your Python app makes, live, grouped per request, linked to the line of code.
site_url: https://vigneshselvaraj1811.github.io/callscope/
repo_url: https://github.com/Vigneshselvaraj1811/callscope
repo_name: Vigneshselvaraj1811/callscope
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Vignesh Selvaraj

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Frameworks: frameworks.md
      - Command line: cli.md
      - Catching N+1 in tests: testing.md
      - Findings explained: findings.md
  - Reference:
      - Python API: api.md
      - How it works: how-it-works.md
      - Privacy and security: privacy.md
  - FAQ and troubleshooting: faq.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
